[package]
name = "web"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The browser build: the SDK core plus the client-API framing, and nothing else."

[lib]
crate-type = ["cdylib"]

[dependencies]
core-types = { path = "../core-types" }
craftworks-sdk = { path = ".." }
wire = { path = "../wire" }
protocol = { path = "../protocol" }
# PAGE MODE (ruling B): the in-page engine, and its I/O over the client API.
page = { path = "../page" }
page-io = { path = "../page-io" }
engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for the block-id tag on the tree root the panel shows; the SDK owns
# the format, this crate only names the constant.
freenet-prolly = { git = "https://github.com/craft-ec/freenet-prolly", rev = "17d67d8" }
getrandom = { version = "0.2", features = ["js"] }
# Minting the development signing key, and deriving the verifying key the
# Register's contract instance is addressed by.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
