[package]
name = "craftworks-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "App-facing SDK. Every substrate capability is exposed here the phase it lands."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned by revision, not by path: this repo must build for anyone who checks
# it out, and the tree's format decides what an app's data looks like.
freenet-prolly = { git = "https://github.com/craft-ec/freenet-prolly", rev = "9764b86" }
blake3 = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

# The JS surface exists only in the wasm build. The version is pinned to the
# wasm-bindgen CLI: the two must match exactly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
